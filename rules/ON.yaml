# ---------------------------------------------------------------------------
# Ontario staking rules — C1.2
#
# STATUS: DRAFTED, NOT VERIFIED.
#
# Values below marked [SOURCED] were extracted from the regulation text fetched
# on 2026-08-17 and are quoted in `source_quotes` so they can be checked without
# re-reading the whole regulation. Values left null are NOT unknown-in-principle
# — they simply are not in O. Reg. 65/18, and are noted with where to look.
#
# Nothing here is filled from memory. A fee asserted without a citation would
# flow silently into every dossier's economics via C6.5 and nobody would catch
# it, which is why PLAN_C1 1.2 ships this file empty of numbers by default.
#
# TO VERIFY: check each [SOURCED] value, fill the nulls, then set verified_by
# to your name and verified_date. Until then stakeable_now("ON") returns False
# and holding_schedule("ON") refuses to compute.
# ---------------------------------------------------------------------------
juris: ON
staking_method: online_map          # MLAS; paper staking ended 2018-01-08
unit_name: cell claim

# [MEASURED] From our own ON__ON_MLAS_ADMIN__CellGrid_south_CSRS layer, over a
# 400,000-cell sample of the 5,216,498-cell provincial grid: median 21.35 ha,
# mean 21.31, range 21.1–21.5 for the bulk. Note this contradicts MASTER §6c's
# "17.7 ha north / 24 ha south" — the actual grid is close to uniform at ~21.3 ha.
# Measured rather than looked up, so it is checkable against the layer.
unit_area_ha: 21.35

# [SOURCED] Fee schedule item 1.
registration_cost:
  amount: 50.00
  currency: CAD
  per: cell

# [SOURCED] Fee schedule item 3 — note the 5-YEAR term, so the licence recurs
# once per five years across a holding horizon, not annually.
licence:
  required: true
  cost: {amount: 40.00, per: 5}
  process: >
    Purchased and renewed electronically through MLAS; a valid prospector's
    licence is a prerequisite to registering a mining claim.

# [SOURCED] O. Reg. 65/18 s.4(1). Flat per cell per year — Ontario does NOT
# escalate with claim age, unlike the escalating-band jurisdictions the schema
# was designed around. Boundary claims and certain converted-legacy cells are
# $200; this file models the ordinary cell claim.
work_requirement:
  - {years: "1-N", amount_per_unit: 400.00, unit: cell}

# [SOURCED] "Payment in place" is Ontario's term. Allowed, but hedged about with
# restrictions that matter to a holding strategy: it cannot run two years
# running, so it buys one year of relief and not a way to sit on ground
# indefinitely. Rate is the current year's required work, i.e. $400/cell.
cash_in_lieu:
  allowed: true
  rate: 400.00                      # equal to the current year's required work
  restrictions:
    - "Cannot exceed the required amount to keep the claim for the current year"
    - "Only after the first unit of required assessment work has been fulfilled"
    - "Only for the current assessment year"
    - "Cannot be made for two consecutive years on the same claim"

# [SOURCED] O. Reg. 65/18 s.19(2). Reserve credits may be applied to the
# assessment year of distribution "and the five subsequent assessment years".
# Per-allocation maxima scale with claim size — recorded in notes, not modelled.
credit_banking:
  allowed: true
  max_years_forward: 5
  transferable_with_claim: null

# PARTIALLY SOURCED. The fee schedule has NO line item for transferring a mining
# CLAIM. Item 8 ($100 + HST) is consent to transfer a mining LEASE or licence of
# occupation, which is a different instrument. Item 15 ($20 per mining claim) is
# "recording an agreement, power of attorney, writ of execution or any other
# instrument affecting a mining claim" and is the plausible candidate — but
# reading it as the claim-transfer fee is an interpretation, not a citation, so
# it is left null.
transfer:
  allowed: null
  fee: null
  process: null

# [SOURCED] O. Reg. 65/18 s.1, definition of "assessment year": "the one-year
# period between the day the mining claim is registered and its first
# anniversary date and every subsequent periods between anniversary dates".
# Grace period, forfeiture timing and exactly when lapsed ground reopens are NOT
# covered here and still need filling — they matter directly to C1.6 lapse watch.
expiry_mechanics: >
  Assessment year runs from registration to the first anniversary date, then
  anniversary to anniversary (O. Reg. 65/18 s.1). TO CONFIRM: grace period after
  a due date, forfeiture timing, and the interval before forfeited ground becomes
  open for restaking.

consultation_notes: null            # duty-to-consult triggers for early exploration
exempt_lands_notes: null

source_quotes:
  work_requirement: >
    "the following amount of money is the amount of money that is required to be
    spent on assessment work on a mining claim each year under section 65 of the
    Act in order to satisfy the annual units of assessment work: 1. For cell
    claims, whether single cell claims or multi-cell claims, $400.00 for each
    cell included in the claim, subject to paragraphs 3 and 4. 2. For boundary
    claims, $200.00." — O. Reg. 65/18 s.4(1)
  registration_cost: >
    "1. For the registration of a mining claim, per cell. $50.00 No tax"
    — Administrative Fees for Mining Lands, item 1
  licence: >
    "3. For a prospector's licence, under subsection 19(1), or a renewal of
    prospector's licence under subsection 21(1) (5 year term). $40.00 No tax"
    — Administrative Fees for Mining Lands, item 3
  cash_in_lieu: >
    "In certain circumstances, a claim holder may make a payment in place of
    performing assessment work required for a mining claim." … "A payment in
    place cannot exceed the required amount to keep the mining claim for the
    current year." … "Payment in place can only be made after the first unit of
    required assessment work has been fulfilled" … "can only be made for the
    current assessment year" … "A payment cannot be made for two consecutive
    years on the mining claim."
    — Assessment Work: Allocating Credits, Applying Credits and Making Payment in Place
  credit_banking: >
    "The maximum amount of assessment work credits that may be allocated from the
    reserve for a mining claim to one or more contiguous mining claims in any
    assessment year is, i. $50,000.00 [boundary or 1–2 cell claim], ii.
    $100,000.00 [3–5 cells], or iii. $150,000.00 [6–25 cells]" and credits cover
    "the assessment year in which the distribution is made and the five
    subsequent assessment years." — O. Reg. 65/18 s.19(2)

