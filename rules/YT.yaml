# ---------------------------------------------------------------------------
# YT staking rules — C1.2
#
# NUMBERS ARE DELIBERATELY EMPTY. PLAN_C1 1.2: "Every numeric field is filled
# from the current regulation/fee schedule by a human at verification time —
# the component plan deliberately ships the schema empty of numbers."
#
# Until verified_by/verified_date are set by a person, stakeable_now("YT")
# returns False and holding_schedule("YT") refuses to compute.
#
# The non-numeric facts below (staking method, unit, system, conversion date)
# come from MASTER_PLAN §6c, which was verified 2026-08-13. Confirm them anyway
# at sign-off — they drive whether ground can be acquired at all.
# ---------------------------------------------------------------------------
