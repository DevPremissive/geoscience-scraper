open_questions:
  - "TRANSFER of a mining claim: the fee schedule has no line item for it. Item 8 is
     lease transfer ($100+HST); item 15 is $20 per claim for recording an instrument
     affecting a claim. Confirm which applies, or whether an MLAS claim transfer is
     free."
  - "EXPIRY MECHANICS still incomplete: the assessment-year definition is sourced, but
     grace period after a due date, forfeiture timing and the interval before forfeited
     ground reopens for staking are not on the pages fetched. These drive C1.6 lapse
     watch directly — a lapse alert is worthless if the reopening interval is wrong."
  - "unit_area_ha 21.35 is MEASURED from our own CellGrid layer and CONTRADICTS
     MASTER §6c's '17.7 ha north / 24 ha south'. The grid is near-uniform at ~21.3 ha.
     Confirm which is right; §6c may be describing the pre-2018 legacy claim sizes."
  - "Ontario does NOT escalate assessment work with claim age ($400/cell flat). Confirm,
     because the schema's banded work_requirement was designed for jurisdictions that do."
  - "Do Landform Conservation Areas (ON_LANDFORM_CONSERVATION, 244 features) withdraw
     land from staking, or only restrict development under the Growth Plan?"
  - "Do Municipal Parks (ON_MUNICIPAL_PARK, 388) bar staking? Ontario frequently severs
     surface from mining rights, so municipal surface ownership may not imply the mining
     rights are unavailable."
  - "Provincial Park Admin Zone (ON_PARK_ADMIN_ZONE, 5) is a larger envelope than the
     regulated boundary. Confirm ON_PARKS_REGULATED is the layer with legal effect."
  - "Confirm Indian Reserve (ON_INDIAN_RESERVE, 246) is correctly treated as withdrawn.
     It IS currently subtracted as `withdrawn` in C1.1's stack."
