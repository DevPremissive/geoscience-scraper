  - url: https://www.geologyontario.mndm.gov.on.ca/mines/lands/mining-sequence/fee_schedule_en.pdf
    fetched: 2026-08-17
    http: 200
    note: >
      "Administrative Fees for Mining Lands" — 21 line items. Printed on the
